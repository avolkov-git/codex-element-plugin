name: Build platform releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-latest

    steps:
      - name: Check out source without the full LFS matrix
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Fetch release runtime binaries
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="bin/${{ matrix.platform }}/**" --exclude=""
          node scripts/verify-runtime-binaries.js --platform "${{ matrix.platform }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}." >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        shell: bash
        run: |
          npm run check
          npm run build
          npm run check:models
          npm run check:protocol
          npm run check:mcp-elicitation
          npm run check:markdown-links
          npm run check:transcript-window
          npm run check:runtime
          npm run check:runtime-payload
          npm run check:browser-runtime
          npm run check:features
          npm run eval:context
          node --check media/chat.js
          node --check media/sidebar.js
          node --check media/settings.js
          git diff --check

      - name: Check history isolation and migration
        if: matrix.platform == 'linux-x64'
        run: |
          npm run check:history
          npm run check:identity

      - name: Smoke test the target Codex app-server
        shell: bash
        run: |
          RUNTIME="bin/${{ matrix.platform }}/codex"
          if [[ "${{ matrix.platform }}" == win32-* ]]; then RUNTIME="${RUNTIME}.exe"; fi
          node scripts/app-server-smoke.js "$RUNTIME"
          node scripts/code-mode-mcp-smoke.cjs "$RUNTIME"
          node scripts/code-mode-mcp-smoke.cjs "$RUNTIME" --expect-missing-host

      - name: Prepare managed Playwright MCP browser runtime
        shell: bash
        run: |
          node scripts/prepare-browser-runtime.js \
            --root "${RUNNER_TEMP}/codex-browser-runtime" \
            --platform "${{ matrix.platform }}"
          node scripts/browser-runtime-smoke.cjs \
            "${RUNNER_TEMP}/codex-browser-runtime/browser/${{ matrix.platform }}"

      - name: Build platform packages
        shell: bash
        run: |
          node scripts/package-platform-releases.js \
            --platform "${{ matrix.platform }}" \
            --browser-runtime-root "${RUNNER_TEMP}/codex-browser-runtime" \
            --output "${RUNNER_TEMP}/codex-plugin-release"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-element-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ runner.temp }}/codex-plugin-release/codex-plugins-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish platform release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out release metadata source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: codex-element-*-${{ github.ref_name }}
          path: ${{ runner.temp }}/codex-plugin-release
          merge-multiple: true

      - name: Finalize checksums and release notes
        run: node scripts/finalize-platform-release.js --output "${RUNNER_TEMP}/codex-plugin-release"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_DIR="${RUNNER_TEMP}/codex-plugin-release"
          PRERELEASE=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then PRERELEASE=(--prerelease); fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${RELEASE_DIR}"/* --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Codex for 1C: Element ${GITHUB_REF_NAME#v}" \
              "${PRERELEASE[@]}" \
              --notes-file "${RELEASE_DIR}/README_RELEASE.md"
          else
            gh release create "${GITHUB_REF_NAME}" "${RELEASE_DIR}"/* \
              --title "Codex for 1C: Element ${GITHUB_REF_NAME#v}" \
              "${PRERELEASE[@]}" \
              --notes-file "${RELEASE_DIR}/README_RELEASE.md"
          fi
