name: Chat and history regression checks

on:
  pull_request:
  push:
    branches: [master, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEX_TEST_BROWSER_CHANNEL: bundled
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - name: Fetch the Linux runtime used by startup checks
        run: |
          git lfs install --local
          git lfs pull --include="bin/linux-x64/**" --exclude=""
          node scripts/verify-runtime-binaries.js --platform linux-x64
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and validate contracts
        run: |
          npm run build
          npm run check
          npm run check:protocol
          npm run check:models
          npm run check:markdown-links
          npm run check:transcript-window
          npm run check:mcp-elicitation
          npm run eval:context
      - name: Verify persistence and server-side actions
        run: |
          npm run check:history
          npm run check:identity
          npm run check:startup
          npm run check:runtime
          npm run check:runtime-payload
          npm run check:features
          npm run check:services
          npm run check:browser-runtime
          npm run check:pressure
      - name: Verify chat scrolling and worker fallback
        env:
          CODEX_TEST_ARTIFACTS: ${{ runner.temp }}/codex-chat-ui
        run: |
          npm run check:chat-ui
          npm run check:chat-shortcuts
          npm run check:experimental-context
          npm run check:chat-questions
          npm run check:chat-design
          npm run check:settings-browser
          npm run check:chat-pressure
          # The external Element bundle is checked separately on the release workstation.
          CODEX_TEST_SKIP_ELEMENT_WRAPPER=1 npm run check:browser-highlighter
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-chat-ui
          if-no-files-found: ignore
          retention-days: 14
